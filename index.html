<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF4EF;--paper:#FFFFFF;--ink:#18271F;--sub:#5B6B61;--line:#D5E1D8;
  --hero:#1F5A3C;--hero-ink:#FFFFFF;--hero-sub:#BFE0CC;
  --hit:#FFE27A;--hit-ink:#3A2E00;--chip:#E1EDE4;--chip-ink:#1F5A3C;--zs:48%;--zl:38%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101914;--paper:#18241D;--ink:#E8F1EA;--sub:#9DB0A3;--line:#2A3B31;--hero:#123A27;--hero-sub:#9CCBB0;
  --hit:#E8C240;--hit-ink:#2A2100;--chip:#223329;--chip-ink:#A9DCBC;--zs:55%;--zl:66%;}}
:root[data-theme="dark"]{
  --bg:#101914;--paper:#18241D;--ink:#E8F1EA;--sub:#9DB0A3;--line:#2A3B31;--hero:#123A27;--hero-sub:#9CCBB0;
  --hit:#E8C240;--hit-ink:#2A2100;--chip:#223329;--chip-ink:#A9DCBC;--zs:55%;--zl:66%;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto}
.hero{background:var(--hero);color:var(--hero-ink);padding:26px 18px 24px}
.hero h1{margin:0;font-size:clamp(21px,5.2vw,32px);font-weight:900;letter-spacing:-.02em;line-height:1.3;word-break:keep-all}
.hero p{margin:10px 0 0;color:var(--hero-sub);font-size:14px;word-break:keep-all}
.search{margin-top:18px;display:flex;background:var(--paper);border-radius:14px;padding:6px 6px 6px 16px;align-items:center;gap:8px}
.search:focus-within{box-shadow:0 0 0 3px var(--hit)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:19px;font-weight:700;padding:12px 0}
.search input::placeholder{color:var(--sub);font-weight:400;font-size:16px}
.search button{border:0;background:var(--chip);color:var(--chip-ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
main{padding:16px 18px 40px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--sub);margin-bottom:16px}
.label{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hero);color:var(--hero-ink)}
.pill{border:2px solid var(--zc,var(--sub));background:transparent;color:var(--zc,var(--sub));border-radius:10px;padding:4px 11px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--zc,var(--sub));color:var(--paper)}
.status{margin:22px 0 12px;font-size:16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--zc);border-radius:12px;padding:14px 14px 12px 16px}
.top{display:flex;align-items:flex-start;gap:10px}
.icon{font-size:28px;line-height:1.1}
.name{font-size:17px;font-weight:900;letter-spacing:-.01em;margin:0;word-break:keep-all}
.meta{font-size:13px;color:var(--sub);margin:2px 0 0}
.badge{margin-left:auto;background:var(--zc);color:var(--paper);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:3px 9px;font-size:14px}
.tag small{opacity:.75;font-size:11px;margin-left:5px}
.tag.hit{background:var(--hit);color:var(--hit-ink);font-weight:700}
.foot{margin-top:10px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 12px}
.m{font-weight:700;color:var(--chip-ink)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--sub)}
</style>
<style>
.chips{gap:8px}
.booths{margin-top:10px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25);flex:none}
.mapwrap{margin:6px 0 4px}
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;line-height:0}
.mapbox img{width:100%;height:auto;display:block}
.spot{position:absolute;padding:0;margin:0;background:transparent;border:2px solid transparent;border-radius:6px;cursor:pointer}
.spot:hover,.spot:focus-visible{border-color:#111;box-shadow:0 0 0 2px #fff;outline:0}
.idx{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.idx button{border:0;background:var(--chip);color:var(--chip-ink);border-radius:8px;min-width:34px;padding:5px 8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.gh{position:sticky;top:0;z-index:2;margin:18px 0 6px;padding:5px 12px;background:var(--hero);color:var(--hero-ink);border-radius:8px;font-weight:900;font-size:15px;scroll-margin-top:8px}
.row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.rt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rn{font-size:17px;font-weight:700;margin:0;word-break:keep-all}
.rc{font-size:12px;color:var(--sub)}
.where{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.w{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.w:focus-visible,.chip:focus-visible,.idx button:focus-visible,#x:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
.w small{opacity:.75;margin-left:6px;font-size:11px}
dialog{border:0;padding:0;border-radius:16px;background:var(--paper);color:var(--ink);width:calc(100% - 24px);max-width:560px;max-height:86vh;box-shadow:0 12px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,14,.55)}
.dh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:19px;font-weight:900;flex:1;word-break:keep-all}
#x{border:0;background:var(--chip);color:var(--chip-ink);border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer;line-height:1}
.db{padding:6px 16px 18px;overflow:auto;max-height:calc(86vh - 68px)}
.zh{margin:14px 0 0;font-size:14px;font-weight:700;color:var(--chip-ink)}
.cat{margin-top:12px}.cat h3{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--sub)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:3px 9px;font-size:14px}
.tag small{opacity:.75;font-size:11px;margin-left:5px}
.tag.hit{background:var(--hit);color:var(--hit-ink);font-weight:700}
#bk{border:0;background:var(--chip);color:var(--chip-ink);border-radius:10px;height:38px;padding:0 12px;font:inherit;font-weight:700;cursor:pointer}
#bk:focus-visible,.lnk:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
.bkc{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:12px}
.bkc h3{margin:0;font-size:16px;font-weight:900;word-break:keep-all}
.tm{font-size:12px;color:var(--sub);margin-left:6px;font-weight:500}
.pr{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.pr:last-of-type{border-bottom:0}.pr b{white-space:nowrap}
.txt{white-space:pre-line;word-break:keep-all;margin:8px 0 0;font-size:14px;line-height:1.65}
.fee{display:inline-block;margin-top:8px;background:var(--chip);color:var(--chip-ink);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;white-space:pre-line}
.lnk{display:block;margin-top:10px;border:1px solid var(--line);background:var(--paper);color:var(--chip-ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.brand{background:#fff;padding:10px 18px;border-bottom:1px solid #E3E8E4}
.logo{height:46px;width:auto;display:block}
</style>

  b.onclick = onclick; parent.appendChild(b); return b;
}
cats.forEach(c => mkChip($("cats"), c, "chip", () => { selC = selC===c ? "" : c; render(); }, {count:R.filter(r=>r.c===c).length}));
["유기농","무농약","친환경·기타"].forEach(m => mkChip($("methods"), m, "chip", () => { selM = selM===m ? "" : m; render(); }));

// ---- 팝업 ----
const dlg = $("dlg");
function setBack(back){ $("bk").hidden = !back; $("bk").onclick = back || null; }
function openDlg(d, z, hitName, back){
  setBack(back);
  const rows = R.filter(r => r.d===d && (!z || r.z===z));
  $("dt").textContent = z && SPOTS.find(s=>s.d===d&&s.z===z) ? SPOTS.find(s=>s.d===d&&s.z===z).l : d;
  $("dd").style.background = colorOf(d);
  const body = $("db"); body.textContent = "";
  const sum = document.createElement("p"); sum.className="meta"; sum.style.margin="10px 0 0";
  const zs = [...new Set(rows.map(r=>r.z))];
  sum.textContent = `📍 ${zs.join(" · ")}  ·  물품 ${rows.length}개`; body.appendChild(sum);
  const hq = norm($("q").value.trim());
  zs.forEach(zone => {
    if(zs.length>1){ const h=document.createElement("div"); h.className="zh"; h.textContent=`📍 ${zone}`; body.appendChild(h); }
    const zr = rows.filter(r=>r.z===zone);
    cats.forEach(cat => {
      const sub = zr.filter(r=>r.c===cat); if(!sub.length) return;
      const sec = document.createElement("div"); sec.className="cat";
      const h3 = document.createElement("h3"); h3.textContent=cat; sec.appendChild(h3);
      const it = document.createElement("div"); it.className="items";
      sub.forEach(r => {
        const t = document.createElement("span");
        t.className = "tag" + ((hitName && r.n===hitName) || (!hitName && hq && r.nk.includes(hq)) ? " hit" : "");
        t.textContent = r.n;
        const ex = [r.m, r.cert && `인증 ${r.cert}`].filter(Boolean).join(" · ");
        if(ex){ const sm=document.createElement("small"); sm.textContent=ex; t.appendChild(sm); }
        it.appendChild(t);
      });
      sec.appendChild(it); body.appendChild(sec);
    });
  });
  if(!dlg.open) dlg.showModal();
  body.scrollTop = 0;
  const h = body.querySelector(".hit"); if(h) setTimeout(()=>h.scrollIntoView({block:"center"}),30);
}
$("x").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if(e.target===dlg) dlg.close(); });

// ---- 배치도 ----
SPOTS.forEach(sp => {
  const b = document.createElement("button"); b.type="button"; b.className="spot"; b.setAttribute("aria-label", sp.l+" 물품 보기");
  const [x,y,w,h] = sp.r; Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});
  b.onclick = () => openDlg(sp.d, sp.z); $("mapbox").appendChild(b);
  mkChip($("booths"), sp.l, "chip", () => openDlg(sp.d, sp.z), {color:sp.c});
});

// ---- 마당 · 부스 팝업 ----
const YCOLOR = {"먹을거리마당":"#F7C6D9","체험마당":"#F39800","전시마당":"#574498"};
function openYard(y, only){
  setBack(null);
  const all = YARDS[y] || [];
  const booths = only ? all.filter(b=>b.n===only) : all;
  $("dt").textContent = only || y;
  $("dd").style.background = YCOLOR[y];
  const body = $("db"); body.textContent = "";
  const times = [...new Set(booths.map(b=>b.t).filter(Boolean))];
  const common = times.length===1 ? times[0] : "";
  const sum = document.createElement("p"); sum.className="meta"; sum.style.margin="10px 0 0";
  sum.textContent = (only ? `${y}` : `부스 ${booths.length}곳`) + (common ? `  ·  🕙 ${common}` : "");
  body.appendChild(sum);
  booths.forEach(b => {
    const c = document.createElement("div"); c.className="bkc";
    if(!only){
      const h = document.createElement("h3"); h.textContent = b.n;
      if(!common && b.t){ const s=document.createElement("span"); s.className="tm"; s.textContent=b.t; h.appendChild(s); }
      c.appendChild(h);
    }
    if(y==="먹을거리마당"){
      b.rows.forEach(([n,p]) => {
        const r = document.createElement("div"); r.className="pr";
        const a = document.createElement("span"); a.textContent = n;
        const pr = document.createElement("b"); pr.textContent = p;
        r.append(a,pr); c.appendChild(r);
      });
    } else {
      b.rows.forEach(([n,e]) => {
        const p = document.createElement("p"); p.className="txt"; p.textContent = n; c.appendChild(p);
        if(e){ const f=document.createElement("div"); f.className="fee"; f.textContent=e; c.appendChild(f); }
      });
    }
    if(R.some(r=>r.d===b.n)){
      const l = document.createElement("button"); l.type="button"; l.className="lnk"; l.textContent = "🌾 이 교구 농산물 보기";
      l.onclick = () => openDlg(b.n, "", "", () => openYard(y, only));
      c.appendChild(l);
    }
    body.appendChild(c);
  });
  if(!dlg.open) dlg.showModal();
  body.scrollTop = 0;
}
YSPOTS.forEach(sp => {
  const b = document.createElement("button"); b.type="button"; b.className="spot"; b.setAttribute("aria-label", sp.l+" 내용 보기");
  const [x,y,w,h] = sp.r; Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});
  b.onclick = () => openYard(sp.y, sp.b); $("mapbox").appendChild(b);
});
["먹을거리마당","체험마당","전시마당"].forEach(y => mkChip($("yards"), y, "chip", () => openYard(y), {color:YCOLOR[y]}));

const MASS = {t:"🙏가을걷이 감사미사", lines:["12:00~13:00 @명동대성당  /  사회사목국장 윤병길 신부 주례","- 우리농 본부장단, 가톨릭농민회 지도신부, 서울대교구 사회사목국 사제단 공동집전","* 농민, 분회별로 생산한 생명농산물을 봉헌합니다."]};
function openMass(){
  setBack(null);
  $("dt").textContent = MASS.t; $("dd").style.background = "#AFBDB9";
  const body = $("db"); body.textContent = "";
  const c = document.createElement("div"); c.className="bkc";
  MASS.lines.forEach((ln,i) => { const p=document.createElement("p"); p.className="txt"; if(i===0){ p.style.fontWeight="700"; p.style.fontSize="16px"; } p.textContent = ln; c.appendChild(p); });
  body.appendChild(c);
  if(!dlg.open) dlg.showModal();
  body.scrollTop = 0;
}
const CHURCH = [[44.28, 18.66, 8.83, 31.25], [38.17, 26.84, 21.33, 6.3]];
CHURCH.forEach(r => {
  const b = document.createElement("button"); b.type="button"; b.className="spot"; b.setAttribute("aria-label","명동대성당 가을걷이 감사미사 보기");
  const [x,y,w,h] = r; Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});
  b.onclick = openMass; $("mapbox").appendChild(b);
});
mkChip($("yards"), "가을걷이 감사미사", "chip", openMass, {color:"#AFBDB9"});

// ---- 목록 ----
function render(){
  const raw = $("q").value.trim(), q = norm(raw);
  $("clear").hidden = !raw;
  document.querySelectorAll("#cats .chip").forEach(c => c.setAttribute("aria-pressed", String(selC===c.dataset.v)));
  document.querySelectorAll("#methods .chip").forEach(c => c.setAttribute("aria-pressed", String(selM===c.dataset.v)));
  const list = $("list"); list.textContent = ""; $("idx").textContent = "";
  let count = 0, last = "";
  const present = [];
  names.forEach(n => {
    const ents = byName.get(n).filter(r => (!selC||r.c===selC) && (!selM||r.mc===selM) &&
      (!q || r.nk.includes(q) || norm(r.d+r.z).includes(q)));
    if(!ents.length) return;
    count++;
    const g = initial(n);
    if(g!==last){
      last = g; present.push(g);
      const h = document.createElement("div"); h.className="gh"; h.id="g-"+g; h.textContent=g; list.appendChild(h);
    }
    const row = document.createElement("div"); row.className="row";
    const rt = document.createElement("div"); rt.className="rt";
    const nm = document.createElement("h2"); nm.className="rn"; nm.textContent=n;
    const rc = document.createElement("span"); rc.className="rc"; rc.textContent=[...new Set(ents.map(r=>r.c))].join(" · ");
    rt.append(nm,rc);
    const wh = document.createElement("div"); wh.className="where";
    const seen = new Set();
    ents.forEach(r => {
      const key = r.d+"|"+r.z+"|"+r.m; if(seen.has(key)) return; seen.add(key);
      const b = document.createElement("button"); b.type="button"; b.className="w";
      const dot = document.createElement("span"); dot.className="dot"; dot.style.background=colorOf(r.d);
      b.append(dot, document.createTextNode(r.d));
      if(r.m){ const s=document.createElement("small"); s.textContent=r.m; b.appendChild(s); }
      b.setAttribute("aria-label", `${r.d} 부스 물품 보기`);
      b.onclick = () => openDlg(r.d, "", n);
      wh.appendChild(b);
    });
    row.append(rt,wh); list.appendChild(row);
  });
  const parts = [raw && `‘${raw}’`, selC, selM].filter(Boolean).join(" · ");
  if(!count){
    const e = document.createElement("div"); e.className="empty";
    e.textContent = "조건에 맞는 물품이 없어요. 다른 이름으로 검색하거나 선택한 분류·생산방식을 해제해 보세요.";
    list.appendChild(e); $("status").textContent = ""; return;
  }
  $("status").textContent = parts ? `${parts}: 품목 ${count}개` : `전체 품목 ${count}개 · 가나다순`;
  if(!q && !selC && !selM || count>30) present.forEach(g => {
    const b = document.createElement("button"); b.type="button"; b.textContent=g.length>2?"#":g;
    b.onclick = () => $("g-"+g).scrollIntoView({behavior:"smooth",block:"start"}); $("idx").appendChild(b);
  });
}
$("q").addEventListener("input", render);
$("clear").onclick = () => { $("q").value=""; $("q").focus(); render(); };
render();
</script>
</body>
</html>
