<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생명농산물 직거래 나눔마당 물품 찾기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF4EF;--paper:#FFFFFF;--ink:#18271F;--sub:#5B6B61;--line:#D5E1D8;
  --hero:#1F5A3C;--hero-ink:#FFFFFF;--hero-sub:#BFE0CC;
  --hit:#FFE27A;--hit-ink:#3A2E00;--chip:#E1EDE4;--chip-ink:#1F5A3C;--zs:48%;--zl:38%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101914;--paper:#18241D;--ink:#E8F1EA;--sub:#9DB0A3;--line:#2A3B31;--hero:#123A27;--hero-sub:#9CCBB0;
  --hit:#E8C240;--hit-ink:#2A2100;--chip:#223329;--chip-ink:#A9DCBC;--zs:55%;--zl:66%;}}
:root[data-theme="dark"]{
  --bg:#101914;--paper:#18241D;--ink:#E8F1EA;--sub:#9DB0A3;--line:#2A3B31;--hero:#123A27;--hero-sub:#9CCBB0;
  --hit:#E8C240;--hit-ink:#2A2100;--chip:#223329;--chip-ink:#A9DCBC;--zs:55%;--zl:66%;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto}
.hero{background:var(--hero);color:var(--hero-ink);padding:26px 18px 24px}
.hero h1{margin:0;font-size:clamp(21px,5.2vw,32px);font-weight:900;letter-spacing:-.02em;line-height:1.3;word-break:keep-all}
.hero p{margin:10px 0 0;color:var(--hero-sub);font-size:14px;word-break:keep-all}
.search{margin-top:18px;display:flex;background:var(--paper);border-radius:14px;padding:6px 6px 6px 16px;align-items:center;gap:8px}
.search:focus-within{box-shadow:0 0 0 3px var(--hit)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:19px;font-weight:700;padding:12px 0}
.search input::placeholder{color:var(--sub);font-weight:400;font-size:16px}
.search button{border:0;background:var(--chip);color:var(--chip-ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
main{padding:16px 18px 40px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--sub);margin-bottom:16px}
.label{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hero);color:var(--hero-ink)}
.pill{border:2px solid var(--zc,var(--sub));background:transparent;color:var(--zc,var(--sub));border-radius:10px;padding:4px 11px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--zc,var(--sub));color:var(--paper)}
.status{margin:22px 0 12px;font-size:16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--zc);border-radius:12px;padding:14px 14px 12px 16px}
.top{display:flex;align-items:flex-start;gap:10px}
.icon{font-size:28px;line-height:1.1}
.name{font-size:17px;font-weight:900;letter-spacing:-.01em;margin:0;word-break:keep-all}
.meta{font-size:13px;color:var(--sub);margin:2px 0 0}
.badge{margin-left:auto;background:var(--zc);color:var(--paper);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:3px 9px;font-size:14px}
.tag small{opacity:.75;font-size:11px;margin-left:5px}
.tag.hit{background:var(--hit);color:var(--hit-ink);font-weight:700}
.foot{margin-top:10px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 12px}
.m{font-weight:700;color:var(--chip-ink)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--sub)}
</style>
<style>
.card{padding-bottom:14px}
.cat{margin-top:12px}
.cat h3{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--sub)}
.cat .items{margin-top:0}
.chip b{font-weight:500;opacity:.7;margin-left:4px;font-size:12px}
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.tag{display:inline-flex;flex-wrap:wrap;align-items:baseline}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <h1 id="title"></h1><p id="when"></p>
  <label class="search"><span aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="찾는 물품 입력 (예: 고춧가루)" autocomplete="off" aria-label="물품 검색">
    <button id="clear" type="button" hidden>지우기</button></label>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div class="label">자주 찾는 물품</div><div class="chips" id="chips"></div>
  <div class="label">분류별로 보기</div><div class="chips" id="cats" role="group" aria-label="분류 선택"></div>
  <div class="label">생산방식</div><div class="chips" id="methods" role="group" aria-label="생산방식 선택"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</div></main>

const $ = id => document.getElementById(id);
const ALIAS = [[/고추가루/g,"고춧가루"],[/젖/g,"젓"]];
const norm = s => ALIAS.reduce((t,[a,b])=>t.replace(a,b), s.replace(/\s+/g,"").toLowerCase());
const mcat = m => /유기/.test(m) ? "유기농" : /무농/.test(m) ? "무농약" : m ? "친환경·기타" : "";
const ORDER = ["푸성귀","과일","곡류","양념","젓갈","수산물","면류","반찬","음료","간식류","건강","주류","물품"];
const NOCAT = "분류 미기재";
const R = DATA.rows.map(([d,n,m,c,cert,z]) => ({d,n,m,c:c||NOCAT,cert,z,nk:norm(n),mc:mcat(m)}));
const cats = [...ORDER.filter(c=>R.some(r=>r.c===c)), ...(R.some(r=>r.c===NOCAT)?[NOCAT]:[])];
// 카드 = 교구 + 구역
const keys = []; R.forEach(r => { const k = r.d+"|"+r.z; if(!keys.includes(k)) keys.push(k); });
const zones = [...new Set(R.map(r=>r.z))];
let selC = "", selM = "";

$("title").textContent = DATA.title.replace(/\s*물품목록$/,"");
$("when").textContent = DATA.when;
$("note").innerHTML = ""; DATA.note.forEach(t => { const p=document.createElement("div"); p.textContent="※ "+t; $("note").appendChild(p); });
document.title = DATA.title.replace(/\s*물품목록$/,"") + " 물품 찾기";

function mkChip(parent, text, cls, onclick, count){
  const b = document.createElement("button"); b.type="button"; b.className=cls; b.textContent=text; b.dataset.v=text;
  b.setAttribute("aria-pressed","false");
  if(count!==undefined){ const s=document.createElement("b"); s.textContent=count; b.appendChild(s); }
  b.onclick = onclick; parent.appendChild(b);
}
const KW = ["쌀","고춧가루","참기름","들기름","사과","배","단감","대추","생강","마늘","고구마","표고","청국장","된장","김치","꿀","누룽지","젓","콩","호두","더덕","도라지","감말랭이","미역"];
KW.map(k => [k, R.filter(r=>r.nk.includes(k)).length]).filter(x=>x[1]>2)
  .sort((a,b)=>b[1]-a[1]).slice(0,14).forEach(([k]) => mkChip($("chips"), k, "chip", () => { $("q").value = $("q").value===k ? "" : k; render(); }));
cats.forEach(c => mkChip($("cats"), c, "chip", () => { selC = selC===c ? "" : c; render(); }, R.filter(r=>r.c===c).length));
["유기농","무농약","친환경·기타"].forEach(m => mkChip($("methods"), m, "chip", () => { selM = selM===m ? "" : m; render(); }));

function render(){
  const raw = $("q").value.trim(), q = norm(raw);
  $("clear").hidden = !raw;
  document.querySelectorAll("#chips .chip").forEach(c => c.setAttribute("aria-pressed", String(raw===c.dataset.v)));
  document.querySelectorAll("#cats .chip").forEach(c => c.setAttribute("aria-pressed", String(selC===c.dataset.v)));
  document.querySelectorAll("#methods .chip").forEach(c => c.setAttribute("aria-pressed", String(selM===c.dataset.v)));
  const filtering = !!(q||selC||selM);
  const g = $("grid"); g.textContent = ""; let total = 0, cards = 0;
  keys.forEach(k => {
    const [d,z] = k.split("|");
    const place = norm(d+z).includes(q);
    const items = R.filter(r => r.d===d && r.z===z && (!selC||r.c===selC) && (!selM||r.mc===selM) &&
                                (!q || place || r.nk.includes(q)));
    if(!items.length) return;
    total += items.length; cards++;
    const c = document.createElement("article"); c.className="card";
    c.style.setProperty("--zc", `hsl(${zones.indexOf(z)*70+135} var(--zs) var(--zl))`);
    const top = document.createElement("div"); top.className="top";
    const box = document.createElement("div");
    const h = document.createElement("h2"); h.className="name"; h.textContent=d;
    const m = document.createElement("p"); m.className="meta"; m.textContent=`물품 ${items.length}개`;
    box.append(h,m);
    const bd = document.createElement("div"); bd.className="badge"; bd.textContent=`📍 ${z}`;
    top.append(box,bd); c.appendChild(top);
    cats.forEach(cat => {
      const sub = items.filter(r=>r.c===cat); if(!sub.length) return;
      const sec = document.createElement("div"); sec.className="cat";
      const h3 = document.createElement("h3"); h3.textContent=cat; sec.appendChild(h3);
      const it = document.createElement("div"); it.className="items";
      sub.forEach(r => {
        const t = document.createElement("span"); t.className = "tag" + (q && r.nk.includes(q) ? " hit" : "");
        t.textContent = r.n;
        const extra = [r.m, r.cert && `인증 ${r.cert}`].filter(Boolean).join(" · ");
        if(extra){ const sm=document.createElement("small"); sm.textContent=extra; t.appendChild(sm); }
        it.appendChild(t);
      });
      sec.appendChild(it); c.appendChild(sec);
    });
    g.appendChild(c);
  });
  if(!total){
    const e = document.createElement("div"); e.className="empty";
    e.textContent = "조건에 맞는 물품이 없어요. 다른 이름으로 검색하거나 선택한 분류·생산방식을 해제해 보세요.";
    g.appendChild(e); g.style.display="block";
    $("status").textContent = ""; return;
  }
  g.style.display = "";
  const parts = [raw && `‘${raw}’`, selC, selM].filter(Boolean).join(" · ");
  $("status").textContent = filtering ? `${parts}: ${cards}개 교구에서 ${total}개 물품` : `전체 ${keys.length}곳 · 물품 ${total}개`;
}
$("q").addEventListener("input", render);
$("clear").onclick = () => { $("q").value=""; $("q").focus(); render(); };
render();
</script>
</body>
</html>
